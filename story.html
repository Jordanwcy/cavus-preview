const CH=[
{t:'一 · 如果機房夠大，點解唔全部放埋一齊？',h:`<h2>一 · 如果機房夠大，點解唔全部放埋一齊？</h2>
<p>訓練一個大模型，係幾萬粒 GPU 用「集體通訊」方式運作：每一步計算完，所有 GPU 要交換梯度，全部收齊先可以行下一步。所以成個集群嘅有效速度唔係由最快嗰粒晶片決定，而係由最慢嗰條連線決定，呢個叫 latency-bound。</p>
<p>喺左邊呢個機房入面，所有 GPU 相隔幾十米，交換梯度只需幾微秒，灰色「等待」幾乎睇唔到。<b>如果地方夠大，全部放埋一齊當然最好。</b>問題唔係地方。</p>
<div class="ans"><b>真正嘅約束係電。</b>一個機房嘅電由電網接入點劃死，通常幾十 MW 到一百幾 MW。下一批 GPU 要嘅係 GW 級，城市電網畀唔起，一定要起喺有太陽能、水電、風電嘅地方，通常離現有機房五十至一百五十公里。睇下右上角「機房 A 電力」：需求已經超過上限。</div>
<p>其次係土地、冷卻用水、審批同單點風險，但電係第一個撞到嘅牆。撳「下一步」，將第二個機房起喺有電嘅地方。</p>`},
{t:'二 · 電喺一百公里外，玻璃光纖嘅極限',h:`<h2>二 · 電喺一百公里外，玻璃光纖嘅極限</h2>
<p>而家第二個機房起咗喺太陽能場旁邊。兩個機房要當一個集群用，每一步都要經呢條光纖交換梯度。玻璃光纖嘅折射率係 1.47，光喺入面每公里單程要 4.9 微秒，一百公里來回接近一毫秒。</p>
<p>睇下左邊機房：藍色 GPU 計完之後變灰，坐喺度等右邊嘅梯度返嚟。超過某個距離，兩個機房就冇辦法再當一個同步集群用。<b>換句話講，今日 AI 數據中心可以幾大、可以起喺邊度，係由光喺玻璃入面嘅速度劃定嘅。</b></p>
<div class="q">試下將距離拉到 200 km，再將計算時間拉到 100 µs：利用率會跌到一半以下。你買嘅每一粒 GPU，有一半時間喺度等一條線。</div>`},
{t:'三 · 空芯光纖：將介質由玻璃換成空氣',h:`<h2>三 · 空芯光纖：將介質由玻璃換成空氣</h2>
<p>空芯光纖嘅核心係一條直徑幾十微米嘅空氣管，外面用一圈薄壁毛細管以「反諧振」原理將光困住（睇下光纖中間浮起嗰個橫切面）。光喺空氣入面嘅速度接近真空，比玻璃快 31%，所以同一個時延預算之下機房可以拉遠 46%。微軟就係用呢一點將 Azure 區域嘅跨度拉大一倍，起喺有電嘅地方。</p>
<p>空氣嘅光學非線性比玻璃低約一千倍，可以打入更高功率、塞入更多波長，每條光纖容量更大，光模組嘅 DSP 可以更簡單、更慳電。最關鍵係損耗：2019 年 0.65 dB/km，2025 年微軟做到 0.091，2026 年長飛做到 0.04，已經低過實心玻璃 0.14 dB/km 嘅物理下限。</p>
<div class="ans"><b>呢個門檻一過，營運商就開始落單：</b>微軟已鋪 1,200 公里，國內營運商 2026 年招標超過 8.6 億人民幣，東莞到港交所 110 公里商用線已經開通。空芯唔係「下一代」嘅候選，係已經開始取代玻璃嘅嗰一代。</div>
<div class="q">同一個距離，撳「玻璃」同「空芯」互相比較：光點快咗，灰色等待縮短三分一，利用率升返。</div>`},
{t:'四 · Cavus 做緊乜',h:`<h2>四 · Cavus 做緊乜</h2>
<p>長飛、亨通呢啲大廠做嘅係千公里幹線，賣畀電訊商。數據中心營運商要嘅係由機房到機房、由城市到有電嗰個地方嘅<b>最後一百公里</b>，仲要接落佢哋現有嘅 MPO、LC 設備（睇下兩端閃緊嘅接頭），而呢一層冇人做。</p>
<p>Cavus 用 AI 引擎設計光纖幾何；第一階段向大廠買光纖、由立訊集團旗下上市線纜廠端接、經我哋家族做咗二十年、覆蓋亞太同中東嘅 CommScope 分銷網絡安裝入數據中心，第三個月有收入；第二階段賣自己設計嘅光纖，拉絲喺理大嘅塔；自建工廠係第四個閘門之後、有真實需求數據先做嘅 A 輪決定。</p>
<div class="ans"><b>我哋賣嘅唔係一條線，係「將 GPU 起喺有電嘅地方」呢個選項。</b></div>
<p style="font-size:12.5px;color:#5a6a7a">設計引擎：<a href="fab.html" style="color:#1a5276">CavusFab</a> · 接頭模型：<a href="sim.html" style="color:#1a5276">CavusSim</a> · 聯絡：jordan@excelunit.com.hk</p>`},
{t:'五 · Scale-across 慳幾多電、幾多錢',h:`<h2>五 · Scale-across 慳幾多電、幾多錢</h2>
<p>同一個集群跨兩個機房運作，叫 scale-across。錢由三度嚟，全部跟住上面嘅滑桿即時計。</p>
<div class="eco"><label>集群規模 <input id="eMW" type="number" value="100" min="10" step="10"> MW</label><label>GPU 數量 <input id="eN" type="number" value="62500" min="1000" step="500"></label><label>城市電價 HK$<input id="eCity" type="number" value="1.2" step="0.1">/kWh</label><label>綠電電價 HK$<input id="eRem" type="number" value="0.5" step="0.1">/kWh</label><label>GPU 租金 HK$<input id="eRent" type="number" value="20" step="1">/小時</label></div>

<tr><td>等緊嘅電力（浪費）</td><td id="eWg">—</td><td id="eWh">—</td></tr>
</table>
<div class="ans"><b>① 電：</b>換成空芯，每年少浪費 <b id="eKwh">—</b> 度電，值 <b id="eKwhM">—</b>。</div>
<div class="ans"><b>② 算力：</b>同一批 GPU 每年多出 <b id="eGh">—</b> GPU 小時，按租金計值 <b id="eGhM">—</b>。</div>
<div class="ans"><b>③ 選址：</b>因為兩個機房可以當一個集群，B 機房可以起喺綠電邊。<span id="eMWb">—</span> MW（集群嘅三分之二）用綠電而唔係城市電，每年電費差 <b id="eSite">—</b>。呢個先係最大嗰筆。</div>
<div class="q">全部係示意計算：利用率用上面嘅同步模型，電價、租金、GPU 密度可以改。目的係俾你睇到數量級，唔係報價。</div>`}];

 if(s===1)setFibre(4.9);
 document.getElementById('prev').disabled=s===0;document.getElementById('next').textContent=s===4?'返回第一步':'下一步';if(s===4){targetCam(-60,55,120,0,4,0);setFibre(3.4);bindEcon();}}
let camGoal=null;function targetCam(x,y,z,tx,ty,tz){camGoal={p:new THREE.Vector3(x,y,z),t:new THREE.Vector3(tx,ty,tz)};}
function setFibre(v){us=v;fibreMat.color.set(v<4?AIR:GLASS);document.getElementById('bG').classList.toggle('on',v>4);document.getElementById('bH').classList.toggle('on',v<4);}
document.getElementById('bG').onclick=()=>setFibre(4.9);document.getElementById('bH').onclick=()=>setFibre(3.4);
document.getElementById('dist').oninput=e=>{km=+e.target.value;document.getElementById('dv').textContent=km;};
document.getElementById('comp').oninput=e=>{comp=+e.target.value;document.getElementById('cv').textContent=comp;};
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setStage(+b.dataset.s));
document.getElementById('next').onclick=()=>setStage((stage+1)%5);document.getElementById('prev').onclick=()=>setStage(Math.max(0,stage-1));


const E={MW:100,N:62500,city:1.2,rem:0.5,rent:20};
function bindEcon(){[['eMW','MW'],['eN','N'],['eCity','city'],['eRem','rem'],['eRent','rent']].forEach(([id,k])=>{const el=document.getElementById(id);if(!el)return;el.value=E[k];el.oninput=()=>{E[k]=+el.value||0;};});}
const fmtN=x=>Math.round(x).toLocaleString();
const fmtM=x=>x>=1e8?'HK$'+(x/1e8).toFixed(2)+' 億':x>=1e4?'HK$'+fmtN(x/1e4)+' 萬':'HK$'+fmtN(x);
function econ(){const rtG=2*km*4.9+3,rtH=2*km*3.4+3;const uG=comp/(comp+rtG),uH=comp/(comp+rtH);const dU=uH-uG;
 const kwh=E.MW*1000*8760*dU;const kwhM=kwh*E.city;const gh=E.N*8760*dU;const ghM=gh*E.rent;const MWb=Math.round(E.MW*2/3);const site=MWb*1000*8760*(E.city-E.rem);
 const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v;};
 set('eUg',Math.round(uG*100)+'%');set('eUh',Math.round(uH*100)+'%');set('eWg',(E.MW*(1-uG)).toFixed(1)+' MW');set('eWh',(E.MW*(1-uH)).toFixed(1)+' MW');
 set('eKwh',fmtN(kwh));set('eKwhM',fmtM(kwhM));set('eGh',fmtN(gh));set('eGhM',fmtM(ghM));set('eMWb',MWb);set('eSite',fmtM(site));
 document.getElementById('hSave').textContent=fmtM(kwhM+ghM);document.getElementById('hSaveBox').style.display=stage>0?'':'none';}
function paint(list,m){list.forEach(c=>c.material.color.set(m));}
const clock=new THREE.Clock();
function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);const sim=dt*SCALE;
 const {rt,step:st}=stepTimes();pt+=sim;
 const remote=stage>0;
 if(phase==='c'){paint(A.userData.gpus,BLUE);paint(B.userData.gpus,BLUE);if(pt>=comp){phase=remote?'s':'l';pt=0;}}
 else if(phase==='l'){paint(A.userData.gpus,GOLD);if(pt>=3){phase='c';pt=0;step++;}}
 else{const f=Math.min(pt/rt,1);paint(B.userData.gpus,GOLD);paint(A.userData.gpus,f<0.5?GOLD:GREY);
  pulses.forEach((p,i)=>{const u=(f*2+i*0.09)%1;const out=(f*2+i*0.09)<1;p.visible=true;const pos=path.getPoint(out?u:1-u);p.position.copy(pos);p.material.color.set(us<4?AIR:GLASS);});
  if(pt>=rt){phase='c';pt=0;step++;pulses.forEach(p=>p.visible=false);}}
 if(!remote)pulses.forEach(p=>p.visible=false);
 const util=remote?comp/st:comp/(comp+3);const waiting=(phase==='s'&&pt/rt>=0.5)?16:0;
 document.getElementById('hStep').textContent=Math.round(remote?st:comp+3).toLocaleString()+' µs';
 document.getElementById('hUtil').textContent=Math.round(util*100)+'%';document.getElementById('hWait').textContent=waiting+' / 32';
 const pow=document.getElementById('hPow');pow.textContent=stage===0?'需求 300 MW / 上限 100 MW':'A 100 MW · B 200 MW（太陽能）';pow.style.color=stage===0?'#c0392b':'#0A1B2E';
 const blink=(Math.sin(performance.now()/200)+1)/2;A.userData.panel.material.color.set(stage===3?new THREE.Color(GOLD).lerp(new THREE.Color(NAVY),blink):NAVY);B.userData.panel.material.color.copy(A.userData.panel.material.color);
 econ();twin.rotation.y+=dt*.6;turb.children[1].rotation.z+=dt*1.5;
 if(camGoal){camera.position.lerp(camGoal.p,.04);ctrl.target.lerp(camGoal.t,.04);if(camera.position.distanceTo(camGoal.p)<.5)camGoal=null;}
 ctrl.update();resize();renderer.render(scene,camera);}
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==Math.floor(w*renderer.getPixelRatio())){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}}
setStage(Math.min(4,Math.max(0,+(new URLSearchParams(location.search).get('s')||0))));frame();
</script>
</body></html>
