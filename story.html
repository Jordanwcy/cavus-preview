const CH=[
`<h2>一 · 如果机房够大，为什么不把 GPU 全放在一起？</h2>
<p>训练一个大模型，是几万颗 GPU 以"集体通信"的方式运行：每一步计算完成后，所有 GPU 交换梯度，全部收齐才能进入下一步。所以整个集群的有效速度不是由最快的芯片决定，而是由最慢的那条链路决定，这叫 latency-bound。</p>
<p>在左边这个机房里，所有 GPU 相距几十米，交换梯度只需几微秒，灰色的"等待"几乎看不见。<b>如果空间足够，全部放在一起当然最好。</b>问题不在空间。</p>
<div class="ans"><b>真正的约束是电。</b>一个机房的电力由电网接入点决定，通常是几十到一百多兆瓦。下一批 GPU 需要的是吉瓦级，城市电网供不起，必须建在有太阳能、水电、风电的地方，通常距现有机房五十到一百五十公里。看左上角"机房 A 电力"：需求已经超过上限。</div>
<p>其次是土地、冷却用水、审批和单点风险，但电是第一堵墙。点"下一步"，把第二个机房建到有电的地方。</p>`,
`<h2>二 · 电在一百公里外：玻璃光纤的极限</h2>
<p>现在第二个机房建在了太阳能电站旁边。两个机房要当一个集群使用，每一步都要通过这条光纤交换梯度。玻璃光纤的折射率是 1.47，光在其中每公里单程需要 4.9 微秒，一百公里往返接近一毫秒。</p>
<p>但链路时延不只是光在路上的时间。每一端的光模块要做编码、纠错和数字信号处理，标准相干模块每端约 15 微秒；而一次跨机房的集体通信通常不止一个往返，先做 reduce-scatter 再做 all-gather，至少两轮。这些都要乘起来。</p>
<p>看左边机房：蓝色 GPU 算完之后变灰，坐着等右边的梯度回来。超过某个距离，两个机房就无法再当一个同步集群使用。<b>换句话说，今天 AI 数据中心能建多大、能建在哪里，是由光在玻璃中的速度和链路两端的电子时延共同划定的。</b></p>
<div class="q">GPU 利用率越高越好：它是 GPU 真正在计算的时间比例，其余时间在通电空等。点任一数字格可看计算过程。试试把距离拉到 200 km、同步轮次拉到 4、计算时间拉到 100 µs：利用率会跌到个位数。你买的每一颗 GPU，大部分时间在等一条线。</div>`,
`<h2>三 · 空芯光纤：把介质从玻璃换成空气</h2>
<p>空芯光纤的核心是一根直径几十微米的空气管，外面用一圈薄壁毛细管以"反谐振"原理把光困住（看光纤中间悬浮的那个横截面）。光在空气中的速度接近真空，比玻璃快 31%，所以同一个时延预算下机房可以拉远 46%。微软正是用这一点把 Azure 区域的跨度拉大一倍，建在有电的地方。</p>
<p>空气的光学非线性比玻璃低约一千倍，可以注入更高功率、塞入更多波长，每根光纤容量更大；色散也低得多，所以链路两端可以用<b>更简单、时延更低的光模块</b>，DSP 负担更轻、更省电。这两件事叠加：光纤缩短路上的时间，光模块缩短两端的时间。</p>
<p>最关键的是损耗：2019 年 0.65 dB/km，2025 年微软做到 0.091，2026 年长飞做到 0.04，已经低于实心玻璃 0.14 dB/km 的物理下限。</p>
<div class="ans"><b>这个门槛一过，运营商就开始下单：</b>微软已铺设 1,200 公里，国内运营商 2026 年招标超过 8.6 亿元人民币，东莞到港交所 110 公里商用线路已经开通。空芯不是"下一代"的候选，而是已经开始取代玻璃的这一代。</div>
<div class="q">点右上角"Cavus 方案"按钮：空芯 + 低时延光模块。再看"有效算力 vs 基准"——这才是对运营商有意义的数字：同一批 GPU 多出多少可用算力。</div>`,
`<h2>四 · Cavus 在做什么</h2>
<p>长飞、亨通这些大厂做的是千公里干线，卖给电信运营商。数据中心运营商需要的是从机房到机房、从城市到有电的那个地方的<b>最后一百公里</b>，还要接入他们现有的 MPO、LC 设备（看两端闪烁的接头），而这一层没有人做。</p>
<p>Cavus 交付的是一条完整的链路：空芯光纤、匹配的低时延光模块、与实心光纤的接头，装进客户现有的机柜。用 AI 引擎设计光纤几何；第一阶段向大厂采购光纤、由立讯集团旗下上市线缆厂端接、经我们家族二十年、覆盖亚太和中东的 CommScope 分销网络安装进数据中心，第三个月产生收入；第二阶段销售自主设计的光纤，在理工大学的拉丝塔拉丝；自建工厂是第四个里程碑之后、有真实需求数据才做的 A 轮决定。</p>
<div class="ans"><b>我们卖的不是一根线，而是"把 GPU 建在有电的地方"这个选项。</b></div>
<p style="font-size:12.5px;color:#5a6a7a">设计引擎：<a href="fab.html" style="color:#1a5276">CavusFab</a> · 接头模型：<a href="sim.html" style="color:#1a5276">CavusSim</a> · 联系：jordan@excelunit.com.hk</p>`,
`<h2>五 · Scale-across 省多少电、多少钱</h2>
<p>同一个集群跨两个机房运行，叫 scale-across。收益来自三处，全部按上面的滑杆实时计算，基准是"玻璃光纤 + 标准相干光模块"。</p>
